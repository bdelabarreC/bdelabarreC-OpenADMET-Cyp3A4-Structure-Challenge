<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CYP3A4 · Selected models</title>
<link rel="stylesheet" href="molstar.css">
<style>
  :root { --line:#d9d9d9; --ink:#1a1a1a; --muted:#6b6b6b; --hover:#f3f6fb; --sel:#eaf1fb; --exp:#f3dc9a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 13px/1.35 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--ink);
         background: #fff; display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 18px; padding: 8px 10px;
           border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0; font-weight: 700; }
  header .meta { color: var(--muted); }
  header select { font: inherit; padding: 2px 4px; }
  #status { color: var(--muted); font-style: italic; }
  main { flex: 1; display: flex; min-height: 0; }
  #side { width: 760px; max-width: 54vw; display: flex; flex-direction: column; border-right: 2px solid var(--line); min-height: 0; }
  .bar { padding: 8px 6px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
  button { font: inherit; padding: 4px 10px; background: #fff; border: 1px solid #b9b9b9; border-radius: 3px; cursor: pointer; }
  button:hover { background: #f2f2f2; }
  label.tg { display: inline-flex; align-items: center; gap: 5px; margin-right: 6px; cursor: pointer; white-space: nowrap; }
  label.tg.off { color: #a0a0a0; cursor: default; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }
  .chip { padding: 1px 5px; border-radius: 2px; }
  #tablewrap { flex: 1; overflow: auto; min-height: 0; }
  table { border-collapse: collapse; width: 100%; }
  th { position: sticky; top: 0; background: #fff; text-align: left; font-weight: 700; padding: 7px 6px;
       border-bottom: 1px solid var(--line); white-space: nowrap; cursor: pointer; user-select: none; }
  th.nosort { cursor: default; }
  th .arrow { color: var(--muted); font-weight: 400; }
  td { padding: 7px 6px; border-bottom: 1px solid #ececec; white-space: nowrap; font-variant-numeric: tabular-nums; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--hover); }
  tbody tr.on { background: var(--sel); }
  td.na { color: #b0b0b0; }
  td .sw { margin-right: 6px; }
  #viewer { flex: 1; position: relative; min-width: 0; min-height: 0; }
  #app { position: absolute; inset: 0; }
  #twoD { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-top: 1px solid var(--line); }
  #twoD[hidden] { display: none; }
  #twoDsvg { width: 250px; height: 165px; flex: none; }
  #twoDtext { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  #twoDsmi { font: 11px/1.3 ui-monospace, Menlo, Consolas, monospace; color: var(--muted); word-break: break-all; }
  .note { padding: 6px 8px; color: var(--muted); border-top: 1px solid var(--line); font-size: 12px; }
  @media (max-width: 760px) {
    main { flex-direction: column-reverse; }
    #side { width: 100%; max-width: none; border-right: 0; border-top: 2px solid var(--line); height: 48%; }
    #viewer { height: 52%; flex: none; }
  }
</style>
</head>
<body>
<header>
  <h1 id="title">CYP3A4 · Selected models</h1>
  <select id="pick" aria-label="Submission"></select>
  <span class="meta" id="desc"></span>
  <span class="meta" id="counts"></span>
  <span id="status">Loading…</span>
</header>
<main>
  <section id="side">
    <div class="bar">
      <button id="selAll">Select all</button>
      <button id="clrAll">Clear all</button>
      <button id="fit">Fit view</button>
      <button id="fitPocket">Zoom to pocket</button>
    </div>
    <div class="bar" id="toggles"></div>
    <div id="tablewrap">
      <table>
        <thead><tr id="head"></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div id="twoD" hidden>
      <div id="twoDsvg"></div>
      <div id="twoDtext"><b id="twoDid"></b><span id="twoDsmi"></span></div>
    </div>
    <div class="note" id="note"></div>
  </section>
  <section id="viewer"><div id="app"></div></section>
</main>

<script src="molstar.js"></script>
<script src="submissions.js"></script>
<script>
(function () {
  const SUBS = window.CYP_SUBMISSIONS || [];
  const statusEl = document.getElementById('status');
  const countsEl = document.getElementById('counts');
  const setStatus = t => { statusEl.textContent = t; };

  // ---- what can be shown -------------------------------------------------
  const PARTS = [
    { key: 'protein',     src: 'pred', part: 'protein', label: 'Protein',              on: true },
    { key: 'ligand',      src: 'pred', part: 'ligand',  label: 'Ligand',               on: true },
    { key: 'heme',        src: 'pred', part: 'heme',    label: 'Heme',                 on: true },
    { key: 'pocket',      src: 'pred', part: 'pocket',  label: 'Pocket side chains',   on: false },
    { key: 'exp_ligand',  src: 'exp',  part: 'ligand',  label: 'Experimental ligand',  on: true, chip: '#f0cf5c' },
    { key: 'exp_protein', src: 'exp',  part: 'protein', label: 'Experimental protein', on: true },
    { key: 'exp_heme',    src: 'exp',  part: 'heme',    label: 'Experimental heme',    on: false },
    { key: 'exp_pocket',  src: 'exp',  part: 'pocket',  label: 'Experimental pocket side chains', on: false },
  ];
  const show = Object.fromEntries(PARTS.map(p => [p.key, p.on]));
  const selected = new Set();
  let byCompound = false;      // false: ligands by atom type (grey C predicted, gold C experimental)
  const stale = new Set();     // part keys whose representations must be rebuilt
  let M = null, models = [], byId = {}, current = null;   // the submission on screen

  function style(p, m) {
    const hex = c => parseInt(c.slice(1), 16);
    switch (p.key) {
      case 'protein':     return { type: 'cartoon', color: 0xb5b5b5, alpha: 0.45 };
      case 'ligand':      return byCompound ? { type: 'ball-and-stick', color: hex(m.color), alpha: 1, size: 1.15 }
                                            : { type: 'ball-and-stick', carbon: 0x808080, alpha: 1, size: 1.15 };
      case 'heme':        return { type: 'ball-and-stick', color: 0x7a4a3a, alpha: 1, size: 1.0 };
      case 'pocket':      return { type: 'ball-and-stick', carbon: 0xc4c4c4, alpha: 1, size: 0.75 };
      case 'exp_pocket':  return { type: 'ball-and-stick', carbon: 0xf0dfa8, alpha: 1, size: 0.75 };
      case 'exp_ligand':  return { type: 'ball-and-stick', carbon: 0xe0a800, alpha: 1, size: 1.15 };
      case 'exp_protein': return { type: 'cartoon', color: 0xe9c46a, alpha: 0.45 };
      case 'exp_heme':    return { type: 'ball-and-stick', color: 0xc9a27e, alpha: 1, size: 1.0 };
    }
  }

  // ---- submission picker ---------------------------------------------------
  const pick = document.getElementById('pick');
  SUBS.forEach(s => {
    const o = document.createElement('option');
    o.value = s.label; o.textContent = 'Submission ' + s.label;
    pick.append(o);
  });
  pick.addEventListener('change', () => openSubmission(pick.value));
  if (SUBS.length < 2) pick.disabled = true;

  // ---- part toggles ----------------------------------------------------------
  const tg = document.getElementById('toggles');
  PARTS.forEach(p => {
    const l = document.createElement('label');
    l.className = 'tg';
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = show[p.key];
    cb.addEventListener('change', () => { show[p.key] = cb.checked; sync(); });
    const s = document.createElement('span');
    s.textContent = p.label;
    if (p.chip) { s.className = 'chip'; s.style.background = p.chip; }
    l.append(cb, s); tg.append(l);
  });
  {
    const l = document.createElement('label');
    l.className = 'tg'; l.title = 'Give each predicted ligand its row colour instead of atom-type colours';
    const cb = document.createElement('input'); cb.type = 'checkbox';
    cb.addEventListener('change', () => { byCompound = cb.checked; stale.add('ligand'); renderRows(); sync(); });
    const sp = document.createElement('span'); sp.textContent = 'Colour predicted ligands by compound';
    l.append(cb, sp); tg.append(l);
  }

  // ---- table -------------------------------------------------------------------
  const COLS = [
    { k: 'show',        t: 'Show',     nosort: true },
    { k: 'id',          t: 'Compound' },
    { k: 'method',      t: 'Method' },
    { k: 'seed',        t: 'Seed',     num: true, asc: true },
    { k: 'binder_type', t: 'Binder type' },
    { k: 'lddt_pli',    t: 'LDDT-PLI', num: true, dp: 3, tip: 'Ligand–pocket lDDT against the experimental structure (0–1, higher is better)' },
    { k: 'iptm',        t: 'ipTM',     num: true, dp: 3, tip: 'Interface pTM reported by the folding method' },
    { k: 'dE',          t: 'ΔE',       num: true, dp: 2, asc: true, tip: 'Energy change from refinement' },
    { k: 'lig_rmsd',    t: 'Lig RMSD', num: true, dp: 2, asc: true, tip: 'Symmetry-corrected ligand heavy-atom RMSD (Å) after superposing the binding-site Cα atoms' },
    { k: 'ca_rmsd',     t: 'Cα RMSD',  num: true, dp: 2, asc: true, tip: 'Protein Cα RMSD (Å) between the prediction and the experimental structure, after superposition' },
  ];
  let sortKey = null, sortDir = 1;
  const head = document.getElementById('head');
  COLS.forEach(c => {
    const th = document.createElement('th');
    th.textContent = c.t; if (c.tip) th.title = c.tip;
    if (c.nosort) th.className = 'nosort';
    else th.addEventListener('click', () => {
      if (sortKey === c.k) sortDir = -sortDir; else { sortKey = c.k; sortDir = c.num && !c.asc ? -1 : 1; }
      renderRows();
    });
    c.th = th; head.append(th);
  });

  const fmt = (v, c) => v == null ? '—' : (c.dp != null && typeof v === 'number' ? v.toFixed(c.dp) : String(v));
  const rowsEl = document.getElementById('rows');
  function renderRows() {
    const list = models.slice();
    if (sortKey) list.sort((a, b) => {
      const x = a[sortKey], y = b[sortKey];
      if (x == null && y == null) return 0;
      if (x == null) return 1;
      if (y == null) return -1;
      return (x < y ? -1 : x > y ? 1 : 0) * sortDir;
    });
    COLS.forEach(c => { if (!c.nosort) c.th.innerHTML = c.t + (sortKey === c.k ? ` <span class="arrow">${sortDir > 0 ? '▲' : '▼'}</span>` : ''); });
    rowsEl.textContent = '';
    list.forEach(m => {
      const tr = document.createElement('tr');
      if (selected.has(m.id)) tr.className = 'on';
      COLS.forEach(c => {
        const td = document.createElement('td');
        if (c.k === 'show') {
          const cb = document.createElement('input');
          cb.type = 'checkbox'; cb.checked = selected.has(m.id);
          cb.setAttribute('aria-label', 'Show ' + m.id);
          cb.addEventListener('click', e => e.stopPropagation());
          cb.addEventListener('change', () => toggle(m.id, cb.checked));
          td.append(cb);
        } else if (c.k === 'id') {
          const sw = document.createElement('span');
          sw.className = 'sw'; sw.style.background = byCompound ? m.color : '#808080';
          td.append(sw, document.createTextNode(m.id));
          if (m.exp_lig_copies > 1) {
            const t = document.createElement('span');
            t.textContent = ' ×' + m.exp_lig_copies; t.style.color = '#9a7b00';
            t.title = m.exp_lig_copies + ' ligand copies in the experimental structure; scores use the best-matching copy';
            td.append(t);
          }
        } else {
          td.textContent = fmt(m[c.k], c);
          if (m[c.k] == null) td.className = 'na';
        }
        tr.append(td);
      });
      tr.addEventListener('click', () => toggle(m.id, !selected.has(m.id)));
      tr.addEventListener('mouseenter', () => show2D(m.id));
      tr.addEventListener('mouseleave', () => show2D(focus2D));
      rowsEl.append(tr);
    });
  }

  // 2D structure panel: follows the row under the pointer, otherwise the last compound switched on
  let focus2D = null;
  function show2D(id) {
    const m = byId[id], box = document.getElementById('twoD');
    if (!m || !m.svg) { box.hidden = true; return; }
    box.hidden = false;
    document.getElementById('twoDsvg').innerHTML = m.svg;
    document.getElementById('twoDid').textContent = m.id;
    document.getElementById('twoDsmi').textContent = m.smiles;
  }
  function toggle(id, on) {
    on ? selected.add(id) : selected.delete(id);
    if (on) focus2D = id; else if (focus2D === id) focus2D = [...selected].pop() || id;
    renderRows(); sync(); show2D(focus2D);
  }
  document.getElementById('selAll').onclick = () => { models.forEach(m => selected.add(m.id)); renderRows(); sync(); };
  document.getElementById('clrAll').onclick = () => { selected.clear(); renderRows(); sync(); };

  function renderNote() {
    const missing = [];
    const blank = k => models.every(m => m[k] == null);
    if (blank('method') && blank('seed')) missing.push('method / seed');
    if (blank('binder_type')) missing.push('binder type');
    if (blank('iptm')) missing.push('ipTM');
    if (blank('dE')) missing.push('ΔE');
    const scored = models.filter(m => m.lddt_pli != null);
    const mean = scored.length ? (scored.reduce((a, m) => a + m.lddt_pli, 0) / scored.length).toFixed(3) : null;
    document.getElementById('note').textContent =
      (mean ? `Mean LDDT-PLI ${mean} over ${scored.length} compounds. ` : '')
      + 'Each prediction is superposed on chain A of its experimental structure (Cα fit); ×2 marks structures with two ligand copies in the site. '
      + 'Ligands are coloured by atom type: grey carbons predicted, gold carbons experimental. '
      + 'Pocket side chains are residues with any atom within 5 Å of the ligand. '
      + (missing.length ? 'Not yet supplied: ' + missing.join(', ') + '.' : '');
  }

  // ---- data files (loaded on demand as scripts, so the folder also works from disk) ----
  const cache = {}, waiting = {}, failed = {};
  const deliver = (key, rec) => { cache[key] = rec; (waiting[key] || []).forEach(f => f(rec)); delete waiting[key]; };
  window.CYP_REGISTER_MANIFEST = rec => deliver('manifest|' + rec.label, rec);
  window.CYP_REGISTER_PRED = rec => deliver('pred|' + rec.submission + '|' + rec.id, rec);
  window.CYP_REGISTER_EXP = rec => deliver('exp|' + rec.id, rec);
  function loadScript(key, url) {
    if (cache[key]) return Promise.resolve(cache[key]);
    if (failed[key]) return Promise.reject(new Error('Missing file: ' + url));
    return new Promise((res, rej) => {
      const first = !waiting[key];
      (waiting[key] = waiting[key] || []).push(res);
      if (!first) return;
      const s = document.createElement('script');
      s.src = url;
      s.onerror = () => { failed[key] = true; delete waiting[key]; rej(new Error('Missing file: ' + url)); };
      document.head.append(s);
    });
  }
  const loadManifest = label => loadScript('manifest|' + label, `submissions/${label}/manifest.js`);
  const loadPart = (src, id) => src === 'exp'
    ? loadScript('exp|' + id, `experimental/${id}.js`)
    : loadScript('pred|' + current + '|' + id, `submissions/${current}/${id}.js`);

  async function openSubmission(label) {
    setStatus('Loading…');
    let man;
    try { man = await loadManifest(label); }
    catch (e) { console.error(e); setStatus(`Could not load submissions/${label}/manifest.js`); return; }
    current = label; M = man; models = man.models; byId = Object.fromEntries(models.map(m => [m.id, m]));
    pick.value = label;
        document.getElementById('desc').textContent = (SUBS.find(s => s.label === label) || {}).description || man.description || '';
    document.title = `CYP3A4 · Submission ${label} · Selected models`;
    try { if (location.hash !== '#' + label) history.replaceState(null, '', '#' + label); } catch (e) {}
    [...selected].forEach(id => { if (!byId[id]) selected.delete(id); });
    if (!selected.size && models.length) selected.add(models[0].id);
    if (!byId[focus2D]) focus2D = [...selected][0];
    renderRows(); renderNote(); show2D(focus2D); sync();
  }

  // ---- Mol* --------------------------------------------------------------
  let plugin = null;
  const refs = {};            // "<submission or exp>|id|part key" -> root state ref
  let chain = Promise.resolve(), pending = false, firstFit = true;

  async function addPart(refKey, id, p) {
    const rec = await loadPart(p.src, id);
    const text = rec[p.part];
    if (!text) return;
    const st = style(p, byId[id]);
    const b = plugin.builders;
    const data = await b.data.rawData({ data: text, label: `${id} ${p.label}` });
    const traj = await b.structure.parseTrajectory(data, 'pdb');
    const model = await b.structure.createModel(traj);
    const structure = await b.structure.createStructure(model);
    const comp = await b.structure.tryCreateComponentStatic(structure, 'all');
    const typeParams = { alpha: st.alpha };
    if (st.size) typeParams.sizeFactor = st.size * 0.15;
    // atom-type colouring: N/O/S etc. by element, carbons in one flat colour
    const colour = st.carbon != null
      ? { color: 'element-symbol', colorParams: { carbonColor: { name: 'uniform', params: { value: st.carbon } } } }
      : { color: 'uniform', colorParams: { value: st.color } };
    await b.structure.representation.addRepresentation(comp, { type: st.type, typeParams, ...colour });
    refs[refKey] = data.ref;
  }

  async function doSync() {
    pending = false;
    if (!M) return;
    const nExp = [...selected].filter(id => byId[id] && byId[id].has_exp).length;
    countsEl.textContent = `${selected.size} of ${models.length} models shown · ${nExp} experimental overlay${nExp === 1 ? '' : 's'}`;
    const want = new Map();   // ref key -> [id, part]
    selected.forEach(id => PARTS.forEach(p => {
      if (!show[p.key] || !byId[id]) return;
      if (p.src === 'exp') { if (byId[id].has_exp) want.set(`exp|${id}|${p.key}`, [id, p]); }
      else want.set(`${current}|${id}|${p.key}`, [id, p]);
    }));
    const drop = Object.keys(refs).filter(k => !want.has(k) || stale.has(k.split('|')[2]));
    stale.clear();
    if (drop.length) {
      const bld = plugin.build();
      drop.forEach(k => { bld.delete(refs[k]); delete refs[k]; });
      await bld.commit();
    }
    const add = [...want.keys()].filter(k => !(k in refs));
    add.sort((a, b) => /protein/.test(a) - /protein/.test(b));   // small parts first
    let n = 0, problem = '';
    for (const k of add) {
      if (pending) break;                       // a newer request supersedes this one
      setStatus(`Loading ${++n}/${add.length}…`);
      const [id, p] = want.get(k);
      try { await addPart(k, id, p); }
      catch (e) { console.error(e); problem = e.message || ('Could not load ' + id); }
    }
    if (firstFit && Object.keys(refs).length) { firstFit = false; zoomPocket(0); }
    if (!pending) setStatus(problem);
  }
  function sync() {
    if (!plugin) return;
    pending = true;
    chain = chain.then(doSync).catch(e => { console.error(e); setStatus('Viewer error'); });
  }

  function zoomPocket(ms) {
    if (!M) return;
    const sel = [...selected].filter(id => byId[id]);
    const c = sel.length === 1 ? byId[sel[0]].center : M.pocket_center;
    try { plugin.canvas3d.camera.focus(Float64Array.from(c), 24, ms == null ? 250 : ms); }
    catch (e) { plugin.managers.camera.reset(); }
  }
  document.getElementById('fit').onclick = () => plugin && plugin.managers.camera.reset();
  document.getElementById('fitPocket').onclick = () => plugin && zoomPocket();

  // ---- start -----------------------------------------------------------------
  if (!SUBS.length) { setStatus('No submissions found (submissions.js is missing or empty).'); return; }
  const fromHash = decodeURIComponent((location.hash || '').slice(1));
  const start = SUBS.some(s => s.label === fromHash) ? fromHash : SUBS[0].label;
  window.addEventListener('hashchange', () => {
    const h = decodeURIComponent(location.hash.slice(1));
    if (h !== current && SUBS.some(s => s.label === h)) openSubmission(h);
  });
  openSubmission(start);
  molstar.Viewer.create('app', {
    layoutIsExpanded: false, layoutShowControls: false, layoutShowRemoteState: false,
    layoutShowSequence: false, layoutShowLog: false, layoutShowLeftPanel: false,
    viewportShowExpand: false, viewportShowSelectionMode: false, viewportShowAnimation: false,
    viewportShowControls: false, viewportShowSettings: false, viewportShowTrajectoryControls: false,
    collapseLeftPanel: true, collapseRightPanel: true,
  }).then(v => {
    plugin = v.plugin;
    try {
      plugin.canvas3d.setProps({ renderer: { backgroundColor: 0xffffff }, camera: { manualReset: true } });
    } catch (e) {}
    sync();
  }).catch(e => { console.error(e); setStatus('The 3D viewer could not start in this browser.'); });
})();
</script>
</body>
</html>
