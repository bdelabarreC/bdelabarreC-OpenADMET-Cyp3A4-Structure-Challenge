<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CYP3A4 · Submission 9A · Selected models</title>
<link rel="stylesheet" href="molstar.css">
<style>
  :root { --line:#d9d9d9; --ink:#1a1a1a; --muted:#6b6b6b; --hover:#f3f6fb; --sel:#eaf1fb; --exp:#f3dc9a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 13px/1.35 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--ink);
         background: #fff; display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 18px; padding: 8px 10px;
           border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0; font-weight: 700; }
  header .meta { color: var(--muted); }
  #status { color: var(--muted); font-style: italic; }
  main { flex: 1; display: flex; min-height: 0; }
  #side { width: 610px; max-width: 48vw; display: flex; flex-direction: column; border-right: 2px solid var(--line); min-height: 0; }
  .bar { padding: 8px 6px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
  button { font: inherit; padding: 4px 10px; background: #fff; border: 1px solid #b9b9b9; border-radius: 3px; cursor: pointer; }
  button:hover { background: #f2f2f2; }
  label.tg { display: inline-flex; align-items: center; gap: 5px; margin-right: 6px; cursor: pointer; white-space: nowrap; }
  label.tg.off { color: #a0a0a0; cursor: default; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }
  .chip { padding: 1px 5px; border-radius: 2px; }
  #tablewrap { flex: 1; overflow: auto; min-height: 0; }
  table { border-collapse: collapse; width: 100%; }
  th { position: sticky; top: 0; background: #fff; text-align: left; font-weight: 700; padding: 7px 6px;
       border-bottom: 1px solid var(--line); white-space: nowrap; cursor: pointer; user-select: none; }
  th.nosort { cursor: default; }
  th .arrow { color: var(--muted); font-weight: 400; }
  td { padding: 7px 6px; border-bottom: 1px solid #ececec; white-space: nowrap; font-variant-numeric: tabular-nums; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--hover); }
  tbody tr.on { background: var(--sel); }
  td.na { color: #b0b0b0; }
  td .sw { margin-right: 6px; }
  #viewer { flex: 1; position: relative; min-width: 0; min-height: 0; }
  #app { position: absolute; inset: 0; }
  .note { padding: 6px 8px; color: var(--muted); border-top: 1px solid var(--line); font-size: 12px; }
  @media (max-width: 760px) {
    main { flex-direction: column-reverse; }
    #side { width: 100%; max-width: none; border-right: 0; border-top: 2px solid var(--line); height: 48%; }
    #viewer { height: 52%; flex: none; }
  }
</style>
</head>
<body>
<header>
  <h1 id="title">CYP3A4 · Selected models</h1>
  <span class="meta" id="counts"></span>
  <span id="status">Loading…</span>
</header>
<main>
  <section id="side">
    <div class="bar">
      <button id="selAll">Select all</button>
      <button id="clrAll">Clear all</button>
      <button id="fit">Fit view</button>
      <button id="fitPocket">Zoom to pocket</button>
    </div>
    <div class="bar" id="toggles"></div>
    <div id="tablewrap">
      <table>
        <thead><tr id="head"></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="note" id="note"></div>
  </section>
  <section id="viewer"><div id="app"></div></section>
</main>

<script src="molstar.js"></script>
<script src="manifest.js"></script>
<script>
(function () {
  const M = window.CYP_MANIFEST;
  const models = M.models;
  const byId = Object.fromEntries(models.map(m => [m.id, m]));
  const anyExp = models.some(m => m.has_exp);

  // ---- what can be shown -------------------------------------------------
  // key = part name inside each data file; src = 'pred' | 'exp'
  const PARTS = [
    { key: 'protein',     src: 'pred', part: 'protein', label: 'Protein',              on: true,  swatch: '#b5b5b5' },
    { key: 'ligand',      src: 'pred', part: 'ligand',  label: 'Ligand',               on: true,  swatch: null },
    { key: 'heme',        src: 'pred', part: 'heme',    label: 'Heme',                 on: true,  swatch: '#7a4a3a' },
    { key: 'pocket',      src: 'pred', part: 'pocket',  label: 'Pocket side chains',   on: false, swatch: '#8f8f8f' },
    { key: 'exp_ligand',  src: 'exp',  part: 'ligand',  label: 'Experimental ligand',  on: true,  swatch: '#f0cf5c', chip: true },
    { key: 'exp_protein', src: 'exp',  part: 'protein', label: 'Experimental protein', on: true,  swatch: '#e9c46a' },
    { key: 'exp_heme',    src: 'exp',  part: 'heme',    label: 'Experimental heme',    on: false, swatch: '#c9a27e' },
    { key: 'exp_pocket',  src: 'exp',  part: 'pocket',  label: 'Experimental pocket side chains', on: false, swatch: '#d9b95a' },
  ];
  const show = Object.fromEntries(PARTS.map(p => [p.key, p.on]));
  const selected = new Set([models[0].id]);
  let byCompound = false;      // false: ligands by atom type (grey C predicted, gold C experimental)
  const stale = new Set();     // part keys whose representations must be rebuilt

  function style(p, m) {
    const hex = c => parseInt(c.slice(1), 16);
    switch (p.key) {
      case 'protein':     return { type: 'cartoon', color: 0xb5b5b5, alpha: 0.45 };
      case 'ligand':      return byCompound ? { type: 'ball-and-stick', color: hex(m.color), alpha: 1, size: 1.15 }
                                            : { type: 'ball-and-stick', carbon: 0x808080, alpha: 1, size: 1.15 };
      case 'heme':        return { type: 'ball-and-stick', color: 0x7a4a3a, alpha: 1, size: 1.0 };
      case 'pocket':      return { type: 'ball-and-stick', carbon: 0xc4c4c4, alpha: 1, size: 0.75 };
      case 'exp_pocket':  return { type: 'ball-and-stick', carbon: 0xf0dfa8, alpha: 1, size: 0.75 };
      case 'exp_ligand':  return { type: 'ball-and-stick', carbon: 0xe0a800, alpha: 1, size: 1.15 };
      case 'exp_protein': return { type: 'cartoon', color: 0xe9c46a, alpha: 0.45 };
      case 'exp_heme':    return { type: 'ball-and-stick', color: 0xc9a27e, alpha: 1, size: 1.0 };
    }
  }

  // ---- header / toggles / table -----------------------------------------
  document.getElementById('title').textContent =
    `${M.title} · Submission ${M.submission} · Selected ${models.length} models`;
  const statusEl = document.getElementById('status');
  const countsEl = document.getElementById('counts');
  const setStatus = t => { statusEl.textContent = t; };

  const tg = document.getElementById('toggles');
  PARTS.forEach(p => {
    const avail = p.src === 'pred' || anyExp;
    const l = document.createElement('label');
    l.className = 'tg' + (avail ? '' : ' off');
    if (!avail) l.title = 'Experimental structures not loaded yet';
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = show[p.key] && avail; cb.disabled = !avail;
    cb.addEventListener('change', () => { show[p.key] = cb.checked; sync(); });
    const s = document.createElement('span');
    s.textContent = p.label;
    if (p.chip) { s.className = 'chip'; s.style.background = avail ? p.swatch : '#f1f1f1'; }
    l.append(cb, s); tg.append(l);
  });

  {
    const l = document.createElement('label');
    l.className = 'tg'; l.title = 'Give each predicted ligand its row colour instead of atom-type colours';
    const cb = document.createElement('input'); cb.type = 'checkbox';
    cb.addEventListener('change', () => { byCompound = cb.checked; stale.add('ligand'); renderRows(); sync(); });
    const sp = document.createElement('span'); sp.textContent = 'Colour predicted ligands by compound';
    l.append(cb, sp); tg.append(l);
  }

  const COLS = [
    { k: 'show',     t: 'Show',     nosort: true },
    { k: 'id',       t: 'Compound' },
    { k: 'method',   t: 'Method' },
    { k: 'seed',     t: 'Seed',     num: true },
    { k: 'model',    t: 'Model',    num: true },
    { k: 'lddt_pli', t: 'LDDT-PLI', num: true, dp: 3 },
    { k: 'iptm',     t: 'ipTM',     num: true, dp: 3 },
    { k: 'ca_rmsd',  t: 'Cα RMSD',  num: true, dp: 2, asc: true, tip: 'Protein Cα RMSD (Å) between the prediction and chain A of the experimental structure, after superposition' },
  ];
  let sortKey = null, sortDir = 1;
  const head = document.getElementById('head');
  COLS.forEach(c => {
    const th = document.createElement('th');
    th.textContent = c.t; if (c.tip) th.title = c.tip;
    if (c.nosort) th.className = 'nosort';
    else th.addEventListener('click', () => {
      if (sortKey === c.k) sortDir = -sortDir; else { sortKey = c.k; sortDir = c.num && !c.asc && c.k !== 'seed' && c.k !== 'model' ? -1 : 1; }
      renderRows();
    });
    c.th = th; head.append(th);
  });

  const fmt = (v, c) => v == null ? '—' : (c.dp != null ? Number(v).toFixed(c.dp) : String(v));
  const rowsEl = document.getElementById('rows');
  function renderRows() {
    const list = models.slice();
    if (sortKey) list.sort((a, b) => {
      const x = a[sortKey], y = b[sortKey];
      if (x == null && y == null) return 0;
      if (x == null) return 1;
      if (y == null) return -1;
      return (x < y ? -1 : x > y ? 1 : 0) * sortDir;
    });
    COLS.forEach(c => { if (!c.nosort) c.th.innerHTML = c.t + (sortKey === c.k ? ` <span class="arrow">${sortDir > 0 ? '▲' : '▼'}</span>` : ''); });
    rowsEl.textContent = '';
    list.forEach(m => {
      const tr = document.createElement('tr');
      if (selected.has(m.id)) tr.className = 'on';
      COLS.forEach(c => {
        const td = document.createElement('td');
        if (c.k === 'show') {
          const cb = document.createElement('input');
          cb.type = 'checkbox'; cb.checked = selected.has(m.id);
          cb.setAttribute('aria-label', 'Show ' + m.id);
          cb.addEventListener('click', e => e.stopPropagation());
          cb.addEventListener('change', () => toggle(m.id, cb.checked));
          td.append(cb);
        } else if (c.k === 'id') {
          const sw = document.createElement('span');
          sw.className = 'sw'; sw.style.background = byCompound ? m.color : '#808080';
          td.append(sw, document.createTextNode(m.id));
          if (m.exp_lig_copies > 1) {
            const t = document.createElement('span');
            t.textContent = ' ×' + m.exp_lig_copies; t.style.color = '#9a7b00';
            t.title = m.exp_lig_copies + ' ligand copies in the experimental structure';
            td.append(t);
          }
        } else {
          td.textContent = fmt(m[c.k], c);
          if (m[c.k] == null) td.className = 'na';
        }
        tr.append(td);
      });
      tr.addEventListener('click', () => toggle(m.id, !selected.has(m.id)));
      rowsEl.append(tr);
    });
  }
  function toggle(id, on) { on ? selected.add(id) : selected.delete(id); renderRows(); sync(); }
  document.getElementById('selAll').onclick = () => { models.forEach(m => selected.add(m.id)); renderRows(); sync(); };
  document.getElementById('clrAll').onclick = () => { selected.clear(); renderRows(); sync(); };

  const missing = [];
  if (!anyExp) missing.push('experimental structures');
  if (models.every(m => m.lddt_pli == null)) missing.push('LDDT-PLI');
  if (models.every(m => m.iptm == null)) missing.push('ipTM');
  if (models.every(m => m.method == null)) missing.push('method / seed / model');
  document.getElementById('note').textContent =
    (anyExp ? 'Each prediction is superposed on chain A of its experimental structure (Cα fit); ×2 marks structures with two ligand copies in the site. '
            : 'Predictions are superposed on a common frame (Cα fit to the first model). ')
    + 'Ligands are coloured by atom type: grey carbons predicted, gold carbons experimental. Pocket side chains are residues with any atom within 5 Å of that model’s ligand. '
    + (missing.length ? 'Still to add: ' + missing.join(', ') + '.' : '');

  // ---- data files (loaded on demand as scripts) --------------------------
  const cache = {}, waiting = {};
  window.CYP_REGISTER = rec => { cache[rec.id] = rec; (waiting[rec.id] || []).forEach(f => f(rec)); delete waiting[rec.id]; };
  function loadData(id) {
    if (cache[id]) return Promise.resolve(cache[id]);
    return new Promise((res, rej) => {
      const first = !waiting[id];
      (waiting[id] = waiting[id] || []).push(res);
      if (!first) return;
      const s = document.createElement('script');
      s.src = 'data/' + id + '.js';
      s.onerror = () => rej(new Error('Could not load ' + id));
      document.head.append(s);
    });
  }

  // ---- Mol* --------------------------------------------------------------
  let plugin = null;
  const refs = {};            // "id|key" -> root state ref
  let chain = Promise.resolve(), pending = false, firstFit = true;

  async function addPart(id, p) {
    const rec = await loadData(id);
    const text = rec[p.src] && rec[p.src][p.part];
    if (!text) return;
    const st = style(p, byId[id]);
    const b = plugin.builders;
    const data = await b.data.rawData({ data: text, label: `${id} ${p.label}` });
    const traj = await b.structure.parseTrajectory(data, 'pdb');
    const model = await b.structure.createModel(traj);
    const structure = await b.structure.createStructure(model);
    const comp = await b.structure.tryCreateComponentStatic(structure, 'all');
    const typeParams = { alpha: st.alpha };
    if (st.size) typeParams.sizeFactor = st.size * 0.15;
    // atom-type colouring: N/O/S etc. by element, carbons in one flat colour
    const colour = st.carbon != null
      ? { color: 'element-symbol', colorParams: { carbonColor: { name: 'uniform', params: { value: st.carbon } } } }
      : { color: 'uniform', colorParams: { value: st.color } };
    await b.structure.representation.addRepresentation(comp, { type: st.type, typeParams, ...colour });
    refs[id + '|' + p.key] = data.ref;
  }

  async function doSync() {
    pending = false;
    const nExp = [...selected].filter(id => byId[id].has_exp).length;
    countsEl.textContent = `${selected.size} model${selected.size === 1 ? '' : 's'} · ${nExp} experimental overlay${nExp === 1 ? '' : 's'}`;
    const want = new Set();
    selected.forEach(id => PARTS.forEach(p => {
      if (show[p.key] && (p.src === 'pred' || byId[id].has_exp)) want.add(id + '|' + p.key);
    }));
    const drop = Object.keys(refs).filter(k => !want.has(k) || stale.has(k.split('|')[1]));
    stale.clear();
    if (drop.length) {
      const bld = plugin.build();
      drop.forEach(k => { bld.delete(refs[k]); delete refs[k]; });
      await bld.commit();
    }
    const add = [...want].filter(k => !(k in refs));
    add.sort((a, b) => /protein/.test(a) - /protein/.test(b));   // small parts first
    let n = 0;
    for (const k of add) {
      if (pending) break;                       // a newer request supersedes this one
      const [id, key] = k.split('|');
      setStatus(`Loading ${++n}/${add.length}…`);
      try { await addPart(id, PARTS.find(p => p.key === key)); }
      catch (e) { console.error(e); setStatus('Problem loading ' + id); }
    }
    if (firstFit && Object.keys(refs).length) { firstFit = false; zoomPocket(0); }
    if (!pending) setStatus('');
  }
  function sync() {
    if (!plugin) return;
    pending = true;
    chain = chain.then(doSync).catch(e => { console.error(e); setStatus('Viewer error'); });
  }

  function zoomPocket(ms) {
    const sel = [...selected];
    const c = sel.length === 1 ? byId[sel[0]].center : M.pocket_center;
    try { plugin.canvas3d.camera.focus(Float64Array.from(c), 24, ms == null ? 250 : ms); }
    catch (e) { plugin.managers.camera.reset(); }
  }
  document.getElementById('fit').onclick = () => plugin && plugin.managers.camera.reset();
  document.getElementById('fitPocket').onclick = () => plugin && zoomPocket();

  renderRows();
  molstar.Viewer.create('app', {
    layoutIsExpanded: false, layoutShowControls: false, layoutShowRemoteState: false,
    layoutShowSequence: false, layoutShowLog: false, layoutShowLeftPanel: false,
    viewportShowExpand: false, viewportShowSelectionMode: false, viewportShowAnimation: false,
    viewportShowControls: false, viewportShowSettings: false, viewportShowTrajectoryControls: false,
    collapseLeftPanel: true, collapseRightPanel: true,
  }).then(v => {
    plugin = v.plugin;
    window.__plugin = plugin;
    try {
      plugin.canvas3d.setProps({ renderer: { backgroundColor: 0xffffff }, camera: { manualReset: true } });
    } catch (e) {}
    sync();
  }).catch(e => { console.error(e); setStatus('The 3D viewer could not start in this browser.'); });
})();
</script>
</body>
</html>
